name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so SonarCloud dates the new-code period correctly
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and development tools
        run: python -m pip install --upgrade pip -e ".[dev]"
      - name: Import smoke test
        run: python -c "import homeostat; print(homeostat.__version__)"
      - name: Ruff — lint + format check
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        if: ${{ matrix.python-version != '3.12' }}
        run: pytest -q
      - name: Pytest + branch coverage
        if: ${{ matrix.python-version == '3.12' }}
        run: pytest -q --cov=src/homeostat --cov-report=xml --cov-report=term
      - name: Upload coverage.xml
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  sonar:
    name: SonarCloud
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }} # skip on PRs (no token on forks)
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore coverage.xml
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml
      # Runs only once SONAR_TOKEN is configured; until then the test matrix still
      # provides the repository's executable quality gate.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
