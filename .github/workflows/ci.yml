name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint · type · test · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so SonarCloud dates the new-code period correctly
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling (the core has zero runtime deps)
        run: python -m pip install --upgrade pip ruff pytest pytest-cov
      - name: Ruff — lint + format check
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest + coverage
        run: pytest -q --cov=src/homeostat --cov-report=xml --cov-report=term
      - name: Upload coverage.xml
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  sonar:
    name: SonarCloud
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }} # skip on PRs (no token on forks)
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore coverage.xml
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml
      # Runs only once SONAR_TOKEN is set (see README "Continuous integration");
      # until then this step is skipped and the `test` job alone drives the CI badge.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
