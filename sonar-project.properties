# SonarCloud analysis config (CI-based, run from .github/workflows/ci.yml on push to main).
# The org/projectKey follow SonarCloud's GitHub-import convention (<org>_<repo>); confirm them in
# the SonarCloud UI when you import the repo. The scanner reads coverage.xml (produced by the CI
# `test` job) for the coverage badge/metric.
sonar.organization=rohanvinaik
sonar.projectKey=rohanvinaik_Homeostat

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.10, 3.11, 3.12
sonar.python.coverage.reportPaths=coverage.xml

# scripts/ are operational (not the rigorous core); tests/detective/ are machine-generated,
# intent-free characterizations pinned by their own convergence — excluded from static analysis
# (they are still collected by pytest and count toward coverage).
sonar.exclusions=scripts/**,tests/detective/**
