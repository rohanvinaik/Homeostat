[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homeostat"
version = "0.1.0"
description = "Per-person two-sign mechanism resolution over a prior biological web"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Rohan Vinaik" }]
keywords = [
    "classical-ai",
    "mechanism-discovery",
    "symbolic-reasoning",
    "systems-biology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12",
]

[project.urls]
Repository = "https://github.com/rohanvinaik/Homeostat"
Issues = "https://github.com/rohanvinaik/Homeostat/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
# Detective-generated mutation-characterization suites are machine-authored and intent-free;
# they are pinned by their own convergence, collected by pytest, and excluded from linting
# (mirrors the sonar.exclusions entry). Do not hand-edit them.
extend-exclude = ["tests/detective"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.coverage.run]
relative_files = true
branch = true
source = ["src/homeostat"]

[tool.coverage.report]
# The single un-unit-testable surface: the network I/O boundary. Every name excluded below is a
# urllib download / Ensembl-REST primitive (or an orchestrator that only drives them). They cannot
# run without a live external server, and this codebase is deliberately stdlib-only / no-mock, so a
# unit test can never reach them. The pure PARSERS they feed (load_rows / load_alias_map / load_tsv /
# load_sample_tissue / load_expression / load_proteins_bulk / _parse_fasta) stay FULLY tested -- this
# marks only the raw I/O edge, it exempts no decision. SonarQube reads this same coverage.xml.
exclude_also = [
    "def fetch\\(",                 # every *_fetch download primitive (urllib.urlopen)
    "if not dest.exists\\(\\):",    # the ensure() download-if-absent branch
    "def ensure\\(url",             # the *_fetch network ensure() (download-or-return the cache)
    "def ensure_all\\(",            # network orchestration over ensure()
    "def _get\\(",                  # structural_fetch: Ensembl REST GET
    "def _download\\(",             # structural_fetch: bulk CDS download
    "def canonical_transcript\\(",  # structural_fetch: REST symbol->transcript lookup
    "def fetch_cds\\(",             # structural_fetch: REST CDS fetch
    "def ensure\\(genes",           # structural_fetch: per-gene network ensure
    "def ensure_bulk\\(",           # structural_fetch: bulk-download orchestration
    "def all_events\\(",            # prior_web: assembles the web from the live fetches
    "def read_coexpression\\(",     # parked GTEx orchestration (streams the multi-GB matrix)
    "if __name__ == .__main__.:",   # module CLI entry points (prior_web._main etc.)
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["detective: test generated by Detective"]
